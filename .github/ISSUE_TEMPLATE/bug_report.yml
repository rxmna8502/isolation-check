name: Bug Report
description: Report a defect, crash, or unexpected behavior in isolation-check
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue!
        **SAFETY NOTICE:** Do NOT include passwords, tokens, API keys, full `.env` files, or private database connection URLs. Always sanitize connection strings (e.g. `postgresql://user:[REDACTED]@host:5432/dbname`).

  - type: input
    id: version
    attributes:
      label: isolation-check version
      description: Run `isolation-check --version` and paste the output.
      placeholder: "isolation-check 0.3.0a1"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Operating System and Environment
      description: OS distribution, version, and architecture.
      placeholder: "Ubuntu 22.04 LTS x86_64 / macOS 14 / Windows 11 WSL2"
    validations:
      required: true

  - type: input
    id: docker_version
    attributes:
      label: Docker and Docker Compose versions
      description: Run `docker --version` and `docker compose version`.
      placeholder: "Docker 26.0.0, Docker Compose v2.26.1"
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Command executed
      description: What exact command did you run?
      placeholder: "isolation-check up feature-payments"
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Sanitized configuration
      description: Relevant sections of your `docker-compose.yaml` and `isolation-check.toml` (credentials REDACTED).
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and error output
      description: Paste terminal output, traceback, or JSON error messages.
    validations:
      required: true
