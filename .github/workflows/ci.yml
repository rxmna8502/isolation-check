name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run non-Docker test suite
        env:
          SKIP_DOCKER_SMOKE: "1"
        run: |
          python -m unittest discover tests -v

  packaging:
    name: Package Build & Clean Verification
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Verify package metadata
        run: |
          python -m twine check dist/*

      - name: Test clean wheel installation in isolated environment
        run: |
          python -m venv clean_env
          ./clean_env/bin/pip install dist/*.whl
          ./clean_env/bin/isolation-check --version
          ./clean_env/bin/isolation-check --help
          ./clean_env/bin/isolation-check create --help
          ./clean_env/bin/isolation-check check --help
          ./clean_env/bin/isolation-check up --help
          ./clean_env/bin/isolation-check status --help
          ./clean_env/bin/isolation-check down --help

  docker-smoke-test:
    name: Real Docker Lifecycle Smoke Test
    runs-on: ubuntu-latest
    needs: [test, packaging]

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install isolation-check
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Execute real Docker smoke test
        run: |
          python -m unittest tests/integration/test_runtime_docker_smoke.py -v

      - name: Clean up disposable test Docker resources
        if: always()
        run: |
          docker compose -p env-smoke-a down -v || true
          docker compose -p env-smoke-b down -v || true
          docker volume rm -f env-smoke-a_pgdata env-smoke-b_pgdata || true
