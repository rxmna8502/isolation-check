name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-matrix:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: |
          python -m unittest discover tests -v

  build-and-verify-packaging:
    name: Package Build & Clean Verification
    runs-on: ubuntu-latest
    needs: test-matrix

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Verify package metadata
        run: |
          python -m twine check dist/*

      - name: Test clean wheel installation in isolated environment
        run: |
          python -m venv clean_env
          ./clean_env/bin/pip install dist/*.whl
          ./clean_env/bin/isolation-check --version
          ./clean_env/bin/isolation-check --help
          ./clean_env/bin/isolation-check create --help
          ./clean_env/bin/isolation-check check --help
          ./clean_env/bin/isolation-check up --help
          ./clean_env/bin/isolation-check status --help
          ./clean_env/bin/isolation-check down --help

  docker-lifecycle-smoke:
    name: Real Docker Lifecycle Smoke Test
    runs-on: ubuntu-latest
    needs: test-matrix

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install isolation-check
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Execute real Docker smoke test
        run: |
          python -m unittest tests/integration/test_runtime_docker_smoke.py -v

      - name: Clean up disposable test Docker resources
        if: always()
        run: |
          docker volume rm -f env-smoke-a_pgdata env-smoke-b_pgdata || true
