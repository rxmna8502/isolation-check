name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    name: Build, GitHub Pre-release, and Publish to PyPI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build and verification tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Verify package distributions
        run: |
          python -m twine check dist/*

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: true
          generate_release_notes: true

      # Publishes to PyPI using PyPI Trusted Publishing (OpenID Connect)
      # Configured on PyPI under: Manage Project -> Publishing -> GitHub Actions
      - name: Publish package distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
