name: Release

# Intended Release Process:
# 1. Ensure all CI checks on main pass.
# 2. Review version in pyproject.toml and src/isolation_check/version.py and CHANGELOG.md.
# 3. Configure PyPI Trusted Publishing (OIDC):
#    - Owner: rxmna8502
#    - Repository: isolation-check
#    - Workflow name: release.yml
#    - Environment name: pypi
# 4. In GitHub repository settings (Settings -> Environments):
#    - Create an environment named 'pypi'.
# 5. Push an annotated git tag matching the version (e.g. git tag -a v0.3.0a1 -m "Release v0.3.0a1" && git push origin v0.3.0a1).

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    name: Build, GitHub Pre-release, and Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/isolation-check

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Verify git tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "Error: Tag version ${TAG_VERSION} does not match pyproject.toml version ${PKG_VERSION}"
            exit 1
          fi
          echo "Verified: Git tag ${GITHUB_REF_NAME} matches package version ${PKG_VERSION}."

      - name: Install build and verification tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel from tagged commit
        run: |
          python -m build

      - name: Verify package artifact filenames
        run: |
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          SDIST="dist/isolation_check-${PKG_VERSION}.tar.gz"
          WHEEL="dist/isolation_check-${PKG_VERSION}-py3-none-any.whl"
          if [ ! -f "${SDIST}" ]; then
            echo "Error: Expected sdist file ${SDIST} was not created."
            exit 1
          fi
          if [ ! -f "${WHEEL}" ]; then
            echo "Error: Expected wheel file ${WHEEL} was not created."
            exit 1
          fi
          echo "Verified artifact files exist for version ${PKG_VERSION}."

      - name: Verify package distributions with twine
        run: |
          python -m twine check dist/*

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: dist/*
          prerelease: true
          generate_release_notes: true

      # Publishes to PyPI using PyPI Trusted Publishing (OpenID Connect / OIDC token exchange)
      # No long-lived PyPI API token or password is used.
      - name: Publish package distribution to PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
        with:
          skip-existing: true
