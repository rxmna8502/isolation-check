services:
  web:
    image: node:20-alpine
    command: ["sh", "-c", "node -e 'require(\"http\").createServer((req,res)=>res.end(\"isolation-check demo\")).listen(3000)'"]
    expose:
      - "3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/app_dev

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: app_dev
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
